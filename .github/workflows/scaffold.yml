name: Scaffold Terraform Module Library

on:
  workflow_dispatch:

jobs:
  scaffold:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create folder structure
        run: |
          # Create module folders
          mkdir -p modules/{s3-bucket,vpc-minimal,iam-oidc-github,ecr-repo,eks-minimal,irsa-role}

          # Create example folders
          mkdir -p examples/{vpc-minimal-basic,ci-oidc-ecr-pipeline}

          # Create global budgets folder
          mkdir -p global/budgets

          # Create boilerplate files for all modules
          for m in s3-bucket vpc-minimal iam-oidc-github ecr-repo eks-minimal irsa-role; do
            touch modules/$m/main.tf modules/$m/variables.tf modules/$m/outputs.tf modules/$m/README.md
          done

          # Example stacks
          touch examples/vpc-minimal-basic/{main.tf,backend.tf,providers.tf}
          touch examples/ci-oidc-ecr-pipeline/{main.tf,backend.tf,providers.tf}

          # Global budgets
          touch global/budgets/{main.tf,variables.tf,README.md}

          # Root README
          touch README.md

      - name: Commit scaffold
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Automated scaffold"
          git push
